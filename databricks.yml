# Databricks Asset Bundle: deploys the notebooks, src/ and config/ from this repo
# and defines the jobs in resources/. Workspace host comes from your CLI auth profile.
bundle:
  name: adventureworks-lakehouse

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog that holds the aw_* schemas
    default: workspace
  warehouse_id:
    # No default on purpose: fill it in (see the dbt task in resources/aw_jobs.yml for where to find it),
    # e.g. `default: 1234567890abcdef` here, or pass --var warehouse_id=... / export BUNDLE_VAR_warehouse_id.
    description: ID of the SQL warehouse the dbt task runs on (serverless or pro)

targets:
  dev:
    default: true
    mode: development
