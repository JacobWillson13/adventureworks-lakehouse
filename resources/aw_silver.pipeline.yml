resources:
  pipelines:
    # Silver layer: typed, conformed tables with data quality expectations.
    aw_silver:
      name: aw_silver
      catalog: ${var.catalog}
      schema: aw_silver              # target schema for every dataset the pipeline defines
      serverless: true
      channel: CURRENT
      # Added to sys.path when the pipeline runs its Python sources, so sales.py can `import awlake`.
      # Bundle field `root_path` on the pipeline resource ("added to sys.path when executing Python
      # sources during pipeline execution"); the CLI resolves it relative to this file, like library paths.
      root_path: ../src
      libraries:
        - file:
            path: ../src/02_silver/sales.py
      configuration:
        bronze_schema: ${var.catalog}.aw_bronze   # read in code via spark.conf.get("bronze_schema")
